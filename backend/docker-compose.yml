version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: karma_images_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: karma
      POSTGRES_PASSWORD: karma123
      POSTGRES_DB: karma_images
    ports:
      - "5432:5432"
    volumes:
      - karma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karma -d karma_images"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  karma_pg_data:
